root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/main.exe"
  cmd = "go build -o ./tmp/main.exe ."
  delay = 1000
  # include_ext below matches "html", so frontend/ and public/ must be excluded
  # or every Vite HMR write (and all of node_modules) would trigger a Go
  # rebuild. Matters most under Docker, where the source tree is bind-mounted
  # and .dockerignore does not apply.
  exclude_dir = ["storage", "database", "tmp", "frontend", "public", "node_modules", ".git"]
  exclude_file = []
  exclude_regex = []
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = false
