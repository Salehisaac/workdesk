<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="همکار">
  <title>همکار</title>
  <defs>
    <!-- The app's hero gradient. CSS `linear-gradient(135deg, …)` on a square
         runs corner to corner, top-start to bottom-end, which is what x1/y1 →
         x2/y2 describe here. Colours are the light-theme fallback from
         shared/styles/tokens.css; the live app re-derives the first stop from
         the bridge's accent at runtime, so this is the brand's fixed form. -->
    <linearGradient id="workdeskHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
  </defs>

  <!-- 512 × 512 with a 170.67 radius keeps the header's 36px / 12px squircle
       ratio exactly (1∶3), so the mark scales without changing shape. -->
  <rect width="512" height="512" rx="170.67" fill="url(#workdeskHero)"/>

  <!-- The glyph occupies the middle 50%, matching the 18px icon inside the
       36px tile. Source viewBox is 48 × 48, so 256/48 = 5.3333. -->
